name: Build Unlocked Blink IPA

on:
  workflow_dispatch:

jobs:
  build-blink:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # 1. Setup Configuration Templates with Fallbacks
      - name: Setup Configuration Files
        run: |
          if [ -f "template_setup.xcconfig" ]; then
            cp template_setup.xcconfig developer_setup.xcconfig
          else
            echo "DEVELOPMENT_TEAM =" > developer_setup.xcconfig
          fi
          if [ -f "Blink/template_setup.xcconfig" ]; then
            cp Blink/template_setup.xcconfig Blink/developer_setup.xcconfig
          fi

      # 2. Fetch Precompiled Frameworks & Resources
      - name: Fetch Frameworks and Resources
        run: |
          chmod +x get_frameworks.sh get_resources.sh
          ./get_frameworks.sh
          ./get_resources.sh
          rm -rf Blink.xcodeproj/project.xcworkspace/xcshareddata/

      # 3. Resolve SPM Dependencies
      - name: Resolve Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project Blink.xcodeproj -scheme Blink

      # 4. Patch Paywall
      - name: Patch Paywall Code
        run: |
          sed -i '' 's/RevenueCat/ //g' Blink/Config/BlinkConfig.swift || true
          find . -type f -name "*.swift" -exec sed -i '' 's/isSubscribed = false/isSubscribed = true/g' {} + || true

      # 5. Bulletproof Python Patch: Completely Neutralize Blink8Migrator Logic
      - name: Kill Blink8Migrator Execution
        run: |
          python3 -c '
          import glob, re
          for filepath in glob.glob("**/*.swift", recursive=True):
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  if "Blink8Migrator" in content or "MigrationFileProvider" in content:
                      # Completely stub out perform methods to prevent any NSFileProviderManager calls
                      content = re.sub(r"static func perform\([^)]*\)\s*\{[^}]*\}", "static func perform(steps: [Any] = []) { print(\"Migrator disabled safely\") }", content)
                      content = re.sub(r"static func perform\(\)\s*\{[^}]*\}", "static func perform() { print(\"Migrator disabled safely\") }", content)
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(content)
                      print(f"Successfully gutted migrator in: {filepath}")
              except Exception as e:
                  print(f"Skipped {filepath}: {e}")
          '

      # 6. Build Unsigned iOS App
      - name: Build Unsigned App for iOS
        run: |
          set -o pipefail
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build | tee xcode_build.log || {
              echo "=== BUILD FAILED. EXTRACTING ERRORS ==="
              grep -C 3 -i "error:" xcode_build.log || true
              exit 1
            }

      # 7. Package into .ipa & Strip Plug-ins
      - name: Package and Strip Extensions
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Blink.app Payload/
          rm -rf Payload/Blink.app/PlugIns || true
          rm -rf Payload/Blink.app/Extensions || true
          rm -rf Payload/Blink.app/Frameworks/*.appex || true
          zip -r Blink-Shell-Unlocked.ipa Payload

      # 8. Upload Build Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-Unlocked-IPA
          path: Blink-Shell-Unlocked.ipa
