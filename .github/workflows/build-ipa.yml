name: Build Blink Shell via GPL-Builder Script

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout GPL-Builder Repository
        uses: actions/checkout@v4
        with:
          repository: NewsGuyTor/Blink-Shell-GPL-Builder

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Script Dependencies
        run: |
          brew install jq

      - name: Execute GPL-Builder Script Safely
        run: |
          chmod +x build-blink-shell-gpl.sh
          
          # Wipe local Xcode caches
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          
          # Run the script with overwrite and clean flags to pull a fresh copy
          ./build-blink-shell-gpl.sh --overwrite --clean || true

          # CRITICAL FIX: Find and delete any empty (0-byte) or corrupted JSON/resolved files 
          # that trigger Xcode error 3840
          if [ -d "blink-src" ]; then
            echo "Purging corrupted or empty JSON/resolved files in project..."
            find blink-src -type f \( -name "*.resolved" -o -name "*.json" -o -size 0 \) -delete || true
          fi

          # Run the build again now that the workspace is clean
          ./build-blink-shell-gpl.sh --clean || {
            echo "=== SCRIPT FAILED. PRINTING BUILD LOG ==="
            if [ -f "build-output/build.log" ]; then
              cat build-output/build.log
            else
              echo "build-output/build.log not found."
            fi
            exit 1
          }

      - name: Upload Generated IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-unsigned-v18.4.2
          path: dist/*.ipa
          
