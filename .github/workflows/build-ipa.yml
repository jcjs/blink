name: Build Blink Shell via GPL-Builder Script

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout GPL-Builder Repository
        uses: actions/checkout@v4
        with:
          repository: NewsGuyTor/Blink-Shell-GPL-Builder

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Script Dependencies
        run: |
          brew install jq

      - name: Setup Source and Initialize Submodules
        run: |
          chmod +x build-blink-shell-gpl.sh
          
          # Clear local caches
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          
          # Step 1: Let the script clone the source repository (setup-only)
          ./build-blink-shell-gpl.sh --setup-only --overwrite
          
          # Step 2: CRITICAL - Recursively pull all missing submodules so Xcode finds valid local packages
          if [ -d "blink-src" ]; then
            echo "Initializing and updating git submodules recursively..."
            cd blink-src
            git submodule update --init --recursive
            cd ..
          fi

      - name: Execute Build Phase
        run: |
          # Step 3: Run the build with the fully populated source tree
          ./build-blink-shell-gpl.sh --clean || {
            echo "=== SCRIPT FAILED. PRINTING BUILD LOG ==="
            if [ -f "build-output/build.log" ]; then
              cat build-output/build.log
            else
              echo "build-output/build.log not found."
            fi
            exit 1
          }

      - name: Upload Generated IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-unsigned-v18.4.2
          path: dist/*.ipa
          
