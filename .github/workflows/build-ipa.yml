name: Build Blink Shell via GPL-Builder Script

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout GPL-Builder Repository
        uses: actions/checkout@v4
        with:
          repository: NewsGuyTor/Blink-Shell-GPL-Builder

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Script Dependencies
        run: |
          brew install jq

      - name: Configure Authenticated Git for Dependencies
        run: |
          # Force Git to use the GitHub Actions token for all GitHub HTTPS requests
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Execute GPL-Builder Script for v18.4.2
        run: |
          chmod +x build-blink-shell-gpl.sh
          
          # Wipe corrupted local caches
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          
          # Run the build script cleanly
          ./build-blink-shell-gpl.sh --version v18.4.2 --overwrite --clean || {
            echo "=== SCRIPT FAILED. PRINTING BUILD LOG ==="
            if [ -f "build-output/build.log" ]; then
              cat build-output/build.log
            else
              echo "build-output/build.log not found."
            fi
            exit 1
          }

      - name: Upload Generated IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-unsigned-v18.4.2
          path: dist/*.ipa
          
